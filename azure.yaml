# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# What azd deploys: the infrastructure in infra/, and one service, "web", built from the Dockerfile at the repo root.
# azd builds the image in Azure's registry (remoteBuild), so deploying needs no local Docker.
name: between-the-lines
infra:
  provider: bicep
  path: infra
services:
  web:
    project: .
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
# Once azd has deployed the real image, later provisions must keep it rather than restore the placeholder
# (infra/modules/app-image.bicep). azd doesn't track this for a service like ours, so these hooks do; they change
# only the local azd environment.
hooks:
  postdeploy:
    shell: sh
    run: azd env set SERVICE_WEB_RESOURCE_EXISTS true
  postdown:
    shell: sh
    run: azd env set SERVICE_WEB_RESOURCE_EXISTS false

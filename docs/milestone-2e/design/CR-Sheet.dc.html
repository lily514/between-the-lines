<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Between the Lines — Club crests sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9CC8F0}a:hover{color:#C2DDF6}
</style>
</helmet>
<div style="width: 1280px; min-height: 1120px; box-sizing: border-box; background: #2B1018; color: #F6EDE4; font-family: 'DM Sans', system-ui, sans-serif; padding: 40px 48px">
  <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 700">League crests</h1>
  <p style="margin: 6px 0 0; font-size: 16px; color: #C9B3AE">Ten fictional clubs. One shared roundel, one emblem, two colours plus a theme outline (cream on dark, near-black on light). Shown at 64 px and 24 px.</p>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 24px">
    <section aria-label="Dark theme" style="padding: 18px 20px; background: #2B1018; border: 1px solid #5E3140; border-radius: 16px">
      <h2 style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #C9B3AE">Dark theme</h2>
      <ul style="list-style: none; margin: 0; padding: 0">
        <sc-for list="{{clubs}}" as="c" hint-placeholder-count="10">
          <li style="display: grid; grid-template-columns: 64px 24px 1fr auto; gap: 16px; align-items: center; padding: 8px 0; border-bottom: 1px solid #4A2430">
            <img src="{{c.cd}}" width="64" height="64" alt="{{c.name}} crest">
            <img src="{{c.cd}}" width="24" height="24" alt="">
            <div><div style="font-size: 17px; font-weight: 600">{{c.name}}</div><div style="font-size: 13px; color: #C9B3AE">{{c.motif}}</div></div>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #E3D3CB">{{c.code}}</span>
          </li>
        </sc-for>
      </ul>
    </section>
    <section aria-label="Light theme" style="padding: 18px 20px; background: #F5EDE0; color: #2B1018; border-radius: 16px">
      <h2 style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6E5058">Light theme</h2>
      <ul style="list-style: none; margin: 0; padding: 0">
        <sc-for list="{{clubs}}" as="c" hint-placeholder-count="10">
          <li style="display: grid; grid-template-columns: 64px 24px 1fr auto; gap: 16px; align-items: center; padding: 8px 0; border-bottom: 1px solid #E3D3C3">
            <img src="{{c.cl}}" width="64" height="64" alt="{{c.name}} crest">
            <img src="{{c.cl}}" width="24" height="24" alt="">
            <div><div style="font-size: 17px; font-weight: 600">{{c.name}}</div><div style="font-size: 13px; color: #6E5058">{{c.motif}}</div></div>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #4A2E35">{{c.code}}</span>
          </li>
        </sc-for>
      </ul>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const clubs = [{"code": "RIP", "name": "Ripon Wardens", "motif": "Key", "cp": "#1F6F6B", "cs": "#EAC86E", "ps": 3.7, "dp": "#34BBB4", "dpc": 7.5, "ds": "#EAC86E", "dsc": 10.9, "lp": "#1F6F6B", "lpc": 5.1, "ls": "#A78018", "lsc": 3.1, "cd": "../crests/dark/RIP.svg", "cl": "../crests/light/RIP.svg"}, {"code": "HEX", "name": "Hexham Anchors", "motif": "Anchor", "cp": "#22385E", "cs": "#F29A84", "ps": 5.4, "dp": "#4873BD", "dpc": 3.8, "ds": "#F29A84", "dsc": 8.2, "lp": "#22385E", "lpc": 10.1, "ls": "#E95631", "lsc": 3.1, "cd": "../crests/dark/HEX.svg", "cl": "../crests/light/HEX.svg"}, {"code": "ALN", "name": "Alnwick Weavers", "motif": "Weaver’s shuttle", "cp": "#8E4A96", "cs": "#F3E6CB", "ps": 4.8, "dp": "#914C99", "dpc": 3.1, "ds": "#F3E6CB", "dsc": 14.3, "lp": "#8E4A96", "lpc": 5.1, "ls": "#AC8128", "lsc": 3.1, "cd": "../crests/dark/ALN.svg", "cl": "../crests/light/ALN.svg"}, {"code": "BAK", "name": "Bakewell Badgers", "motif": "Badger's head", "cp": "#2F343B", "cs": "#EADFC4", "ps": 9.5, "dp": "#6C7888", "dpc": 3.9, "ds": "#EADFC4", "dsc": 13.3, "lp": "#2F343B", "lpc": 10.8, "ls": "#9F8139", "lsc": 3.2, "cd": "../crests/dark/BAK.svg", "cl": "../crests/light/BAK.svg"}, {"code": "TRU", "name": "Truro Otters", "motif": "Otter", "cp": "#6B4226", "cs": "#93D6CF", "ps": 5.2, "dp": "#915933", "dpc": 3.1, "ds": "#93D6CF", "dsc": 10.7, "lp": "#6B4226", "lpc": 7.4, "ls": "#38938A", "lsc": 3.2, "cd": "../crests/dark/TRU.svg", "cl": "../crests/light/TRU.svg"}, {"code": "WEL", "name": "Wells Comets", "motif": "Comet", "cp": "#B9A8E6", "cs": "#231B3D", "ps": 7.6, "dp": "#B9A8E6", "dpc": 8.2, "ds": "#6F5AB6", "dsc": 3.2, "lp": "#9378D8", "lpc": 3.1, "ls": "#231B3D", "lsc": 13.9, "cd": "../crests/dark/WEL.svg", "cl": "../crests/light/WEL.svg"}, {"code": "PEN", "name": "Penrith Sentinels", "motif": "Watchtower", "cp": "#B4502A", "cs": "#F1E7D3", "ps": 4.2, "dp": "#CD5B30", "dpc": 4.3, "ds": "#F1E7D3", "dsc": 14.4, "lp": "#B4502A", "lpc": 4.4, "ls": "#A57F34", "lsc": 3.2, "cd":     return { clubs };
  }
}
</script>
</body>
</html>

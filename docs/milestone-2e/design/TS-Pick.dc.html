<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Between the Lines — Pick your team</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9CC8F0}a:hover{color:#C2DDF6}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: {{w}}px; min-height: 960px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'DM Sans', system-ui, sans-serif; padding: 0 {{pad}}px 20px; display: flex; flex-direction: column">

  <div style="padding-top: 20px; display: flex; align-items: center; justify-content: space-between">
    <div role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="4" aria-label="Step 4 of 4" style="display: flex; gap: 6px">
      <span style="width: 28px; height: 4px; border-radius: 2px; background: {{t.act}}"></span><span style="width: 28px; height: 4px; border-radius: 2px; background: {{t.act}}"></span><span style="width: 28px; height: 4px; border-radius: 2px; background: {{t.act}}"></span><span style="width: 28px; height: 4px; border-radius: 2px; background: {{t.act}}"></span>
    </div>
    <span style="font-size: 13px; color: {{t.muted}}">Last step</span>
  </div>

  <div style="padding-top: 28px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; line-height: 1.02; font-weight: 700">Pick your team</h1>
    <p style="margin: 10px 0 0; font-size: 17px; line-height: 1.4; color: {{t.text2}}">They'll be shown first before every match. You can change this any time in Preferences.</p>
  </div>

  <div role="radiogroup" aria-label="Your team" style="margin-top: 22px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{clubs}}" as="club" hint-placeholder-count="10">
      <button role="radio" aria-checked="{{club.checked}}" onClick="{{club.pick}}" style="min-height: 56px; padding: 0 14px; border: {{club.border}}; background: {{club.bg}}; border-radius: 14px; display: flex; align-items: center; gap: 14px; text-align: left">
        <span style="width: 52px; height: 32px; border: 1px solid {{t.borderStrong}}; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; color: {{t.text2}}">{{club.code}}</span>
        <span style="flex: 1; font-size: 17px; font-weight: {{club.weight}}">{{club.name}}</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{club.ring}}" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="{{club.dotR}}" fill="{{club.ring}}" stroke="none"></circle></svg>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding-top: 20px; display: flex; flex-direction: column; gap: 10px">
    <button onClick="{{pickForMe}}" style="height: 52px; border: 1px solid {{t.border}}; background: transparent; border-radius: 14px; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>Pick one for me
    </button>
    <button style="height: 54px; border: 0; background: {{t.act}}; color: {{t.onAct}}; border-radius: 14px; font-size: 17px; font-weight: 700">Continue with {{pickedName}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"panel":{"editor":"boolean","default":false},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const tokens = {
      dark: { bg: '#2B1018', surface: '#3B1A24', selected: '#55293A', border: '#5E3140', borderStrong: '#7A4A58', text: '#F6EDE4', text2: '#E3D3CB', muted: '#C9B3AE', act: '#9CC8F0', onAct: '#2B1018' },
      light: { bg: '#F5EDE0', surface: '#FFFDF9', selected: '#EADBCB', border: '#E3D3C3', borderStrong: '#B89F94', text: '#2B1018', text2: '#4A2E35', muted: '#6E5058', act: '#8C2440', onAct: '#FFFFFF' }
    };
    const t = this.props.theme === 'light' ? tokens.light : tokens.dark;
    const panel = (this.props.panel ?? false) === true;
    const list = [
      ['CAL', 'Calderbrook'], ['EAS', 'Eastholme'], ['FER', 'Fernhollow Athletic'], ['HEX', 'Hexham Anchors'], ['KES', 'Kestrel Bay'],
      ['LIN', 'Linwood Harbour'], ['NOR', 'Northbridge'], ['RAV', 'Ravensford'], ['STM', 'Stanmoor'], ['WES', 'Westmere']
    ];
    const picked = (this.state && this.state.picked) || 'WES';
    const clubs = list.map(([code, name]) => {
      const on = code === picked;
      return {
        code, name, checked: on ? 'true' : 'false',
        border: on ? '2px solid ' + t.act : '1px solid ' + t.border,
        bg: on ? t.selected : t.surface, weight: on ? 700 : 500,
        ring: on ? t.act : t.borderStrong, dotR: on ? 4 : 0,
        pick: () => this.setState({ picked: code })
      };
    });
    const pickedName = (list.find(([c]) => c === picked) || list[9])[1];
    const pickForMe = () => {
      const others = list.filter(([c]) => c !== picked);
      this.setState({ picked: others[Math.floor(Math.random() * others.length)][0] });
    };
    return { t, clubs, pickedName, pickForMe, w: panel ? 420 : 390, pad: panel ? 20 : 16 };
  }
}
</script>
</body>
</html>

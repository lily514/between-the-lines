<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Phone live companion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0}
a{color:#8C2440}a:hover{color:#6E1C32}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; font-family: 'DM Sans', system-ui, sans-serif; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">

<!-- App bar -->
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .06em">BETWEEN <span style="color: {{c.muted}}">THE</span> LINES</span>
<div style="display: flex; gap: 6px">
<button aria-label="Curriculum map" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><circle cx="15" cy="15" r="1.8"></circle><path d="M10.3 11.3l3.4 2.4"></path></svg></button>
<button aria-label="Preferences" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
</div>
</div>

<!-- Compact scorebug -->
<section aria-label="Score, clock and possession" style="background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 14px; padding: 10px 10px 10px; display: flex; flex-direction: column; gap: 8px">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px">
<div style="display: flex; align-items: center; gap: 7px; padding: 6px 4px; border: 2px solid transparent">
<svg width="24" height="24" sc-camel-view-box="0 0 64 64" role="img" aria-label="Whitby Kestrels crest"><circle cx="32" cy="32" r="29.5" fill="#A8285F" stroke="{{c.crestLine}}" stroke-width="2.5"></circle><path d="M10 31 Q21 21 32 28 Q43 21 54 31 Q45 31 38.5 34.5 L34 45 L32 50 L30 45 L25.5 34.5 Q19 31 10 31 Z" fill="#F7CEDA"></path><circle cx="32" cy="26.5" r="3.4" fill="#F7CEDA"></circle></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500">WHI</span>
<span aria-label="home, filled discs" style="width: 10px; height: 10px; border-radius: 50%; background: {{c.text}}; display: inline-block"></span>
</div>
<div aria-label="Score 0 to 0" style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; line-height: 1; display: flex; gap: 8px; align-items: baseline"><span>0</span><span aria-hidden="true" style="color: {{c.muted}}; font-size: 22px">–</span><span>0</span></div>
<div style="justify-self: end; display: flex; align-items: center; gap: 6px; padding: 5px 7px; border: 2px solid {{c.text}}; border-radius: 10px; background: {{c.raised}}">
<span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 2px 5px; border-radius: 4px; background: {{c.text}}; color: {{c.bg}}">YOU</span>
<span aria-label="away, rings" style="width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid {{c.text}}; display: inline-block"></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500">BAK</span>
<svg width="24" height="24" sc-camel-view-box="0 0 64 64" role="img" aria-label="Bakewell Badgers crest"><circle cx="32" cy="32" r="29.5" fill="#2F343B" stroke="{{c.crestLine}}" stroke-width="2.5"></circle><path d="M32 51 C22 51 16.5 41 18 27 C19 19 25 14 32 14 C39 14 45 19 46 27 C47.5 41 42 51 32 51 Z" fill="#EADFC4"></path><path d="M25 17 C24.5 26 26 34 28.5 42 L31 41 C29 33 28.5 25 29 16 Z M39 17 C39.5 26 38 34 35.5 42 L33 41 C35 33 35.5 25 35 16 Z" fill="#2F343B"></path><circle cx="32" cy="46.5" r="2.4" fill="#2F343B"></circle></svg>
</div>
</div>
<div style="display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px">
<button aria-label="Match clock 00:29, first half. Adjust timing to match your TV" style="height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.text}}; display: flex; align-items: center; gap: 8px; font-family: 'DM Sans', sans-serif">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 500">00:29</span>
<span style="font-size: 13px; font-weight: 700; letter-spacing: .08em; color: {{c.muted}}">1ST</span>
<svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"></path><path d="M18 3v4h-4M6 21v-4h4"></path></svg>
</button>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 13px"><span>54%</span><span style="font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: .08em; color: {{c.muted}}">POSSESSION</span><span>46%</span></div>
<div role="img" aria-label="Possession: Whitby Kestrels 54%, Bakewell Badgers 46%" style="display: flex; height: 8px; gap: 2px">
<div style="width: 54%; border-radius: 4px 0 0 4px; background: {{c.text}}"></div>
<div style="flex: 1; box-sizing: border-box; border-radius: 0 4px 4px 0; border: 1.5px solid {{c.text}}; background: {{c.hatch}}"></div>
</div>
</div>
</div>
</section>

<!-- Phase pill row -->
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; letter-spacing: .08em; padding: 6px 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.raised}}"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12h5l2-4 4 8 2-4h7"></path></svg>SETTLED POSSESSION</span>
<span style="font-size: 14px; color: {{c.muted}}">Questions: Normal</span>
</div>

<!-- Pitch -->
<div style="display: flex; justify-content: center">
<svg width="276" height="414" sc-camel-view-box="-3 -3 74 111" role="img" aria-label="Pitch at 00:29. Whitby Kestrels' number 7 has the ball in midfield. Positions are illustrative." style="border-radius: 10px; background: #1E4D38">
<g fill="none" stroke="rgba(246,237,228,.55)" stroke-width="0.4">
<rect x="0" y="0" width="68" height="105"></rect>
<line x1="0" y1="52.5" x2="68" y2="52.5"></line>
<circle cx="34" cy="52.5" r="9.15"></circle>
<rect x="13.84" y="0" width="40.32" height="16.5"></rect>
<rect x="24.84" y="0" width="18.32" height="5.5"></rect>
<rect x="13.84" y="88.5" width="40.32" height="16.5"></rect>
<rect x="24.84" y="99.5" width="18.32" height="5.5"></rect>
</g>
<g fill="#1E4D38" stroke="#EFA27A" stroke-width="0.65">
<circle cx="34" cy="101" r="1.8"></circle>
<circle cx="10" cy="84" r="1.8"></circle><circle cx="25" cy="86" r="1.8"></circle><circle cx="43" cy="86" r="1.8"></circle><circle cx="58" cy="84" r="1.8"></circle>
<circle cx="15" cy="64" r="1.8"></circle><circle cx="29" cy="66" r="1.8"></circle><circle cx="41" cy="65" r="1.8"></circle><circle cx="55" cy="63" r="1.8"></circle>
<circle cx="26" cy="55" r="1.8"></circle><circle cx="42" cy="54" r="1.8"></circle>
</g>
<g font-family="Bricolage Grotesque, sans-serif" font-size="2.4" font-weight="700" text-anchor="middle">
<circle cx="34" cy="4" r="2.2" fill="#F6EDE4"></circle><text x="34" y="4.85" fill="#2B1018">1</text>
<circle cx="12" cy="22" r="2.2" fill="#F6EDE4"></circle><text x="12" y="22.85" fill="#2B1018">3</text>
<circle cx="27" cy="20" r="2.2" fill="#F6EDE4"></circle><text x="27" y="20.85" fill="#2B1018">5</text>
<circle cx="41" cy="20" r="2.2" fill="#F6EDE4"></circle><text x="41" y="20.85" fill="#2B1018">6</text>
<circle cx="56" cy="22" r="2.2" fill="#F6EDE4"></circle><text x="56" y="22.85" fill="#2B1018">2</text>
<circle cx="18" cy="38" r="2.2" fill="#F6EDE4"></circle><text x="18" y="38.85" fill="#2B1018">11</text>
<circle cx="44" cy="40" r="2.2" fill="#F6EDE4"></circle><text x="44" y="40.85" fill="#2B1018">8</text>
<circle cx="55" cy="44" r="2.2" fill="#F6EDE4"></circle><text x="55" y="44.85" fill="#2B1018">10</text>
<circle cx="22" cy="49" r="2.2" fill="#F6EDE4"></circle><text x="22" y="49.85" fill="#2B1018">9</text>
<circle cx="40" cy="50" r="2.2" fill="#F6EDE4"></circle><text x="40" y="50.85" fill="#2B1018">19</text>
<circle cx="31" cy="44" r="2.2" fill="#F6EDE4"></circle><text x="31" y="44.85" fill="#2B1018">7</text>
</g>
<circle cx="32.4" cy="46.3" r="0.95" fill="#FFFFFF" stroke="#2B1018" stroke-width="0.35"></circle>
</svg>
</div>

<!-- Latest caption -->
<section aria-live="polite" aria-label="Latest" style="display: flex; flex-direction: column; gap: 4px">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: {{c.muted}}"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 500; letter-spacing: 0; color: {{c.text}}">00:29</span><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: {{c.text}}; display: inline-block"></span>WHI · Now</span>
<p style="margin: 0; font-size: 19px; font-weight: 600; line-height: 1.3"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 500">#7</span> Ekerafor passes, in midfield.</p>
</section>

<!-- Older note + Earlier notes -->
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid {{c.border}}; padding-top: 8px">
<span style="font-size: 15px; color: {{c.muted}}; min-width: 0"><span style="font-family: 'JetBrains Mono', monospace">00:15</span> <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{c.muted}}; display: inline-block"></span> WHI · Zieličić → Fourchet → Ekerafor</span>
</div>
<a href="PhoneNotes.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; border: 1.5px solid {{c.border}}; color: {{c.act}}; font-size: 15px; font-weight: 700; text-decoration: none">Earlier notes and stats<svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const light = { bg: '#F5EDE0', surface: '#FFFAF3', raised: '#EFE5D8', border: '#DCCAB6', borderStrong: '#8E7563', text: '#2B1018', muted: '#664B51', act: '#8C2440', crestLine: '#2B1018' };
    const darkC = { bg: '#2B1018', surface: '#3B1A24', raised: '#48242E', border: '#5C3842', borderStrong: '#A3828A', text: '#F6EDE4', muted: '#C9B3AE', act: '#9CC8F0', crestLine: '#F6EDE4' };
    const c = Object.assign({}, dark ? darkC : light);
    c.hatch = 'repeating-linear-gradient(135deg, ' + c.text + ' 0 1.5px, transparent 1.5px 5px)';
    return { c };
  }
}
</script>


</body></html>
